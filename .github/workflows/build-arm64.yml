
name: Build Storj QNAP ARM64

on:
  push:
    branches:
      - qnap-get-limit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish ARM64 image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build metadata
        id: vars
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.qnap
          platforms: linux/arm64
          push: true

          tags: |
            r1deit/storj-qnap233:latest
            r1deit/storj-qnap233:sha-${{ steps.vars.outputs.short_sha }}

          cache-from: type=gha,scope=storj-qnap-arm64
          cache-to: type=gha,mode=max,scope=storj-qnap-arm64
